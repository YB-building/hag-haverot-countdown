<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>חג חברות! #1</title><style>:root{color-scheme:light dark;--bg-light:#f8efe6;--surface-light:#fffaf5;--text-light:#2e211c;--accent-light:#d56b8a;--accent2-light:#8b5e83;--muted-light:#876f68;--bg-dark:#241b20;--surface-dark:#33262d;--text-dark:#fff5f0;--accent-dark:#ef8cab;--accent2-dark:#b88db0;--muted-dark:#cdb9b5}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}body{background:light-dark(var(--bg-light),var(--bg-dark))}#app{min-height:100vh;width:100%;background-color:light-dark(var(--bg-light),var(--bg-dark));color:light-dark(var(--text-light),var(--text-dark));display:flex;align-items:center;justify-content:center;padding:24px 16px}.phone{width:min(100%,430px);min-height:calc(100vh - 48px);max-height:860px;border-radius:34px;padding:30px 20px 24px;background:light-dark(var(--surface-light),var(--surface-dark));box-shadow:0 18px 55px #00000022;display:flex;flex-direction:column;justify-content:center;overflow:hidden;position:relative}.decor{position:absolute;border-radius:999px;filter:blur(2px);opacity:.25}.d1{width:180px;height:180px;background:light-dark(#efb1c4,#c76888);top:-80px;right:-60px}.d2{width:140px;height:140px;background:light-dark(#bda5d0,#805879);bottom:-50px;left:-45px}header{text-align:center;position:relative;z-index:1}.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:light-dark(var(--muted-light),var(--muted-dark));margin-bottom:12px}h1{font-size:clamp(32px,9vw,46px);line-height:1.05;margin:0;font-weight:800}.subtitle{margin:12px 0 30px;color:light-dark(var(--muted-light),var(--muted-dark));font-size:15px}.countdown{display:flex;direction:ltr;gap:9px;position:relative;z-index:1}.unit{background:light-dark(#f4e7df,#42323a);border:1px solid light-dark(#ead7cd,#54424b);border-radius:18px;padding:16px 5px 13px;text-align:center;flex:1}.num{font-variant-numeric:tabular-nums;font-size:clamp(27px,7vw,38px);font-weight:800;line-height:1}.label{margin-top:7px;font-size:11px;color:light-dark(var(--muted-light),var(--muted-dark))}.target{margin:28px auto 0;padding:12px 16px;border-radius:999px;background:light-dark(#f7e3ea,#49343e);color:light-dark(#9a4561,#f3a8bf);font-weight:700;font-size:14px;position:relative;z-index:1}.done{font-size:26px;font-weight:800;text-align:center;padding:24px}@media(max-width:380px){.phone{min-height:100vh;border-radius:0;max-height:none}.countdown{gap:6px}.unit{padding:14px 3px 12px}}</style></head><body><main id="app"><section class="phone" aria-label="ספירה לאחור"><span class="decor d1"></span><span class="decor d2"></span><header><div class="kicker">THE COUNTDOWN</div><h1>חג חברות! #1</h1><p class="subtitle">מתקרבות לרגע הגדול ✨</p></header><div id="countdown" class="countdown" aria-live="polite"><div class="unit"><div id="days" class="num">--</div><div class="label">ימים</div></div><div class="unit"><div id="hours" class="num">--</div><div class="label">שעות</div></div><div class="unit"><div id="minutes" class="num">--</div><div class="label">דקות</div></div><div class="unit"><div id="seconds" class="num">--</div><div class="label">שניות</div></div></div><div id="target" class="target">15.10.2026 · 16:00</div></section></main><script>const target=new Date("2026-10-15T16:00:00+03:00").getTime();const els={days:document.getElementById("days"),hours:document.getElementById("hours"),minutes:document.getElementById("minutes"),seconds:document.getElementById("seconds"),countdown:document.getElementById("countdown"),target:document.getElementById("target")};function pad(n){return String(n).padStart(2,"0")}function update(){const diff=target-Date.now();if(diff<=0){els.countdown.innerHTML='<div class="done" style="grid-column:1/-1">הגיע הזמן! 🎉</div>';els.target.textContent="חג חברות התחיל!";clearInterval(timer);return}const total=Math.floor(diff/1000);const days=Math.floor(total/86400);const hours=Math.floor((total%86400)/3600);const minutes=Math.floor((total%3600)/60);const seconds=total%60;els.days.textContent=days;els.hours.textContent=pad(hours);els.minutes.textContent=pad(minutes);els.seconds.textContent=pad(seconds)}update();const timer=setInterval(update,1000);</script></body></html>
